name: Instavar Voice contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  capability-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out companion repository
        uses: actions/checkout@v5
      - name: Check out pinned evaluation contract
        uses: actions/checkout@v5
        with:
          repository: instavar/instavar-voice-evaluation
          ref: 136a18ac0d1266fb584cbf2a783d55a7a71c4d63
          path: .instavar-voice-evaluation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository capability manifest
        run: python .instavar-voice-evaluation/main.py validate-repository "$GITHUB_WORKSPACE"
      - name: Validate historical run evidence
        run: python .instavar-voice-evaluation/main.py validate historical historical-run.json
