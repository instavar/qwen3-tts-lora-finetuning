name: Instavar Voice contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  capability-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out companion repository
        uses: actions/checkout@v5
      - name: Check out pinned evaluation contract
        uses: actions/checkout@v5
        with:
          repository: instavar/instavar-voice-evaluation
          ref: 022c16a822ee4393dae9ce295199de59fecd4d43
          path: .instavar-voice-evaluation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate repository capability manifest
        run: python .instavar-voice-evaluation/main.py validate-repository "$GITHUB_WORKSPACE"
      - name: Verify multi-reference evaluator API
        env:
          PYTHONPATH: .instavar-voice-evaluation
        run: python -c "from instavar_voice_lab.extraction import EXECUTED_MULTI_REFERENCE_EXTRACTION_SCHEMA_VERSION as x, PLANNED_MULTI_REFERENCE_EXTRACTION_SCHEMA_VERSION as v; from instavar_voice_lab.speaker_reference_plans import ASSIGNMENT_PLAN_SCHEMA_VERSION as p; from instavar_voice_lab.speechbrain_ecapa import SPEECHBRAIN_ECAPA_BACKEND as b; assert (x, v, p, b) == ('1.4.0', '1.3.0', '1.0.0', 'instavar_voice_lab.speechbrain_ecapa_v1')"
      - name: Validate historical run evidence
        run: python .instavar-voice-evaluation/main.py validate historical historical-run.json
      - name: Validate executable lifecycle backend
        run: python .instavar-voice-evaluation/main.py validate-backend instavar-voice-backend.json
      - name: Test lifecycle wrapper without model dependencies
        env:
          PYTHONPATH: .instavar-voice-evaluation
        run: python -m unittest tests/test_lifecycle_backend.py -v
